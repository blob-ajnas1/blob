name: Build test APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=config/payments.json --dart-define-from-file=config/supabase.json
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: blob-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
