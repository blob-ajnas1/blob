name: blob
description: BLOB - Agricultural marketplace and daily learning platform for landowners, buyers, brokers, labourers, exporters and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_map: 8.3.1
  latlong2: 0.10.1
  url_launcher: 6.3.2
  http: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/crops/
