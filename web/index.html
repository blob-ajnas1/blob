<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BLOB - one market for every harvest. Connect landowners, buyers, brokers, laborers, transporters and exporters.">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BLOB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BLOB - Agri Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #1B5E20;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1B5E20;
      transition: opacity .35s ease-out;
      z-index: 10;
    }
    #splash img {
      width: 116px;
      height: 116px;
      background: #fff;
      border-radius: 32px;
      padding: 12px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-512.png" alt="BLOB"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); document.body.style.overflow = ''; }, 400);
    });
  </script>
  <!-- Razorpay Checkout for job-posting fees on the web build. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
